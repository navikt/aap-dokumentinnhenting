query ($journalpostId: String!) {
    dokumentoversiktJournalposter(
        journalpostId: $journalpostId
    ) {
        journalposter {
            journalpostId
            dokumenter {
                dokumentInfoId
                tittel
            }
            avsenderMottaker {
                id
                navn
                type
                erLikBruker
            }
        }
    }
}