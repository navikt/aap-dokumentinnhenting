[versions]
ktor = "3.5.2"
kafka = "8.1.1-ce"
kelvin = "2.0.152"
behandlingsflyt = "0.0.656"
tilgang = "1.0.235"
aapBrev = "0.0.280"
logstash = "9.0"
nimbusJoseJwt = "10.9.1"
hikari = "7.1.0"
caffeine = "3.2.4"
junit = "6.1.3"
assertJ = "3.27.7"
testcontainers = "2.0.5"
mockk = "1.14.11"
postgresql = "42.7.13"

[libraries]
# Ktor client
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-jackson = { module = "io.ktor:ktor-client-jackson", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# Kelvin / felleskomponenter
json = { module = "no.nav.aap.kelvin:json", version.ref = "kelvin" }
infrastructure = { module = "no.nav.aap.kelvin:infrastructure", version.ref = "kelvin" }
dbconnect = { module = "no.nav.aap.kelvin:dbconnect", version.ref = "kelvin" }
dbmigrering = { module = "no.nav.aap.kelvin:dbmigrering", version.ref = "kelvin" }
dbtest = { module = "no.nav.aap.kelvin:dbtest", version.ref = "kelvin" }
motor = { module = "no.nav.aap.kelvin:motor", version.ref = "kelvin" }
motor-api = { module = "no.nav.aap.kelvin:motor-api", version.ref = "kelvin" }
server = { module = "no.nav.aap.kelvin:server", version.ref = "kelvin" }
ktor-openapi-generator = { module = "no.nav.aap.kelvin:ktor-openapi-generator", version.ref = "kelvin" }

# Nav-kontrakter
behandlingsflyt-kontrakt = { module = "no.nav.aap.behandlingsflyt:kontrakt", version.ref = "behandlingsflyt" }
brev-kontrakt = { module = "no.nav.aap.brev:kontrakt", version.ref = "aapBrev" }
tilgang-plugin = { module = "no.nav.aap.tilgang:plugin", version.ref = "tilgang" }

# Kafka
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
kafka-streams = { module = "org.apache.kafka:kafka-streams", version.ref = "kafka" }
kafka-streams-test-utils = { module = "org.apache.kafka:kafka-streams-test-utils", version.ref = "kafka" }

# Database
hikari-cp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# Logging
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }

# Diverse
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Test
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertJ" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
motor-test-utils = { module = "no.nav.aap.kelvin:motor-test-utils", version.ref = "kelvin" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[bundles]
test = ["junit-jupiter-params", "assertj", "mockk", "ktor-server-test-host", "testcontainers-postgres", "motor-test-utils"]

[plugins]
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
