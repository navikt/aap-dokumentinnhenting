[versions]
ktor = "3.5.1"
kafka = "8.1.1-ce"
kelvin = "2.0.86"
behandlingsflyt = "0.0.629"
tilgang = "1.0.230"
jackson = "2.22.0"
aapBrev = "0.0.277"
logback = "1.5.37"
logstash = "9.0"
nimbusJoseJwt = "10.9.1"
flyway = "12.9.0"
hikari = "7.1.0"
caffeine = "3.2.4"
micrometerPrometheus = "1.17.0"
junit = "6.1.0"
assertJ = "3.27.7"
testcontainers = "2.0.5"
mockk = "1.14.11"
postgresql = "42.7.11"

[libraries]
# Ktor server
ktorServerAuth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktorServerAuthJwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktorServerCallLogging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktorServerCallLoggingJvm = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor" }
ktorServerContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktorServerCore = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktorServerMetricsMicrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor" }
ktorServerNetty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktorServerStatusPages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktorSerializationJackson = { module = "io.ktor:ktor-serialization-jackson", version.ref = "ktor" }

# Ktor client
ktorClientAuth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorClientJackson = { module = "io.ktor:ktor-client-jackson", version.ref = "ktor" }
ktorClientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# Kelvin / felleskomponenter
json = { module = "no.nav.aap.kelvin:json", version.ref = "kelvin" }
infrastructure = { module = "no.nav.aap.kelvin:infrastructure", version.ref = "kelvin" }
dbconnect = { module = "no.nav.aap.kelvin:dbconnect", version.ref = "kelvin" }
dbmigrering = { module = "no.nav.aap.kelvin:dbmigrering", version.ref = "kelvin" }
dbtest = { module = "no.nav.aap.kelvin:dbtest", version.ref = "kelvin" }
motor = { module = "no.nav.aap.kelvin:motor", version.ref = "kelvin" }
motorApi = { module = "no.nav.aap.kelvin:motor-api", version.ref = "kelvin" }
server = { module = "no.nav.aap.kelvin:server", version.ref = "kelvin" }
ktorOpenApiGenerator = { module = "no.nav.aap.kelvin:ktor-openapi-generator", version.ref = "kelvin" }

# Nav-kontrakter
behandlingsflytKontrakt = { module = "no.nav.aap.behandlingsflyt:kontrakt", version.ref = "behandlingsflyt" }
brevKontrakt = { module = "no.nav.aap.brev:kontrakt", version.ref = "aapBrev" }
tilgangPlugin = { module = "no.nav.aap.tilgang:plugin", version.ref = "tilgang" }

# Kafka
kafkaClients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
kafkaStreams = { module = "org.apache.kafka:kafka-streams", version.ref = "kafka" }
kafkaStreamsTestUtils = { module = "org.apache.kafka:kafka-streams-test-utils", version.ref = "kafka" }

# Database
flywayDatabasePostgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikariCp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# Jackson
jacksonDatatypeJsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jacksonModuleKotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Logging
logbackClassic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstashLogbackEncoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }

# Diverse
micrometerRegistryPrometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometerPrometheus" }
nimbusJoseJwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Test
junitJupiterParams = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
assertJ = { module = "org.assertj:assertj-core", version.ref = "assertJ" }
ktorServerTestHost = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainersPostgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
motorTestUtils = { module = "no.nav.aap.kelvin:motor-test-utils", version.ref = "kelvin" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[bundles]
test = ["junitJupiterParams", "assertJ", "mockk", "ktorServerTestHost", "testcontainersPostgres", "motorTestUtils"]

[plugins]
jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.0" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
