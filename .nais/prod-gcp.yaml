apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: dokumentinnhenting
  namespace: aap
  labels:
    team: aap
    sub: dokumentinnhenting
    systemkatalog.nav.no/system: SK-268

spec:
  image: {{image}}
  replicas:
    cpuThresholdPercentage: 90
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        extra:
          - "NAVident"
          - "azp_name"
        groups:
          - id: ee2a0374-97a6-462e-9a05-3cb7be3d8fc5 #NAIS_TEAM_AAP
  kafka:
    pool: nav-prod
    streams: true
  gcp:
    sqlInstances:
      - type: POSTGRES_16
        tier: db-custom-1-3840
        diskAutoresize: true
        highAvailability: true
        pointInTimeRecovery: true
        databases:
          - name: dokumentinnhenting
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 500m
      memory: 1024Mi
  liveness:
    path: /actuator/live
    initialDelay: 3
    periodSeconds: 3
    failureThreshold: 21
  readiness:
    path: /actuator/ready
    initialDelay: 3
    periodSeconds: 3
    failureThreshold: 21
  prometheus:
    enabled: true
    path: /actuator/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: "java"
    logging:
      destinations:
        - id: elastic
        - id: loki
  env:
    - name: BEHANDLINGSFLYT_BASE_URL
      value: http://behandlingsflyt
    - name: BEHANDLINGSFLYT_SCOPE
      value: api://prod-gcp.aap.behandlingsflyt/.default
    - name: INTEGRASJON_SYFO_BASE_URL
      value: http://isdialogmelding.teamsykefravr
    - name: INTEGRASJON_SYFO_SCOPE
      value: api://prod-gcp.teamsykefravr.isdialogmelding/.default
    - name: INTEGRASJON_SAF_URL_GRAPHQL
      value: https://saf.prod-fss-pub.nais.io/graphql
    - name: INTEGRASJON_SAF_URL_REST
      value: https://saf.prod-fss-pub.nais.io/rest
    - name: INTEGRASJON_SAF_SCOPE
      value: api://prod-fss.teamdokumenthandtering.saf/.default
    - name: INTEGRASJON_DOKARKIV_URL
      value: https://dokarkiv.prod-fss-pub.nais.io
    - name: INTEGRASJON_DOKARKIV_SCOPE
      value: api://prod-fss.teamdokumenthandtering.dokarkiv/.default
    - name: INTEGRASJON_BREV_BASE_URL
      value: http://brev
    - name: INTEGRASJON_BREV_SCOPE
      value: api://prod-gcp.aap.brev/.default
    - name: INTEGRASJON_TILGANG_URL
      value: http://tilgang
    - name: INTEGRASJON_TILGANG_SCOPE
      value: api://prod-gcp.aap.tilgang/.default
    - name: INTEGRASJON_API_INTERN_AZP
      value: 3d3bb28c-d020-46b2-a34a-85201e302878
    - name: INTEGRASJON_BEHANDLINGSFLYT_AZP
      value: ead3bfb6-d403-43b3-bb45-dc184ce314b7
    - name: NAIS_TEAM_AAP
      value: ee2a0374-97a6-462e-9a05-3cb7be3d8fc5
  accessPolicy:
    inbound:
      rules:
        - application: behandlingsflyt
          permissions:
            roles:
              - "syfo-api"
              - "paaminnelse-api"
              - "dialogmelding-api"
        - application: paw-patrol
        - application: saksbehandling
        - application: api-intern
    outbound:
      rules:
        - application: behandlingsflyt
        - application: tilgang
        - application: brev
        - application: isdialogmelding
          namespace: teamsykefravr
      external:
        - host: saf.prod-fss-pub.nais.io
        - host: dokarkiv.prod-fss-pub.nais.io
